services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: canvaslab
      POSTGRES_USER: canvaslab
      POSTGRES_PASSWORD: canvaslab_dev_only
    ports:
      - "5432:5432"
    volumes:
      - canvaslab-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U canvaslab -d canvaslab"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  canvaslab-postgres-data:
