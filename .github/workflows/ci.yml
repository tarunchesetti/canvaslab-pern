name: CI

on:
  push:
    branches: [main, "feat/**", "feature/**"]
  pull_request:
    branches: [main]

jobs:
  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci --prefix client
      - run: npm run build --prefix client
      - run: npm test --prefix client
      - run: npm run lint --prefix client

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --prefix server
      - run: npm run build --prefix server
      - run: npm test --prefix server

  next-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --prefix next-client
      - run: npm run build --prefix next-client
      - name: Report Next.js JavaScript chunk sizes
        working-directory: next-client
        run: |
          node --input-type=module <<'NODE'
          import { readdirSync, statSync, readFileSync } from 'node:fs'
          import { join, relative } from 'node:path'
          import { gzipSync } from 'node:zlib'

          const root = '.next/static/chunks'
          const files = []
          const walk = (dir) => {
            for (const entry of readdirSync(dir)) {
              const path = join(dir, entry)
              if (statSync(path).isDirectory()) walk(path)
              else if (path.endsWith('.js')) files.push(path)
            }
          }
          walk(root)
          let rawTotal = 0
          let gzipTotal = 0
          for (const path of files.sort()) {
            const bytes = readFileSync(path)
            const gzipBytes = gzipSync(bytes).length
            rawTotal += bytes.length
            gzipTotal += gzipBytes
            if (bytes.length >= 10_000) {
              console.log(`${relative(root, path)}: ${(bytes.length / 1024).toFixed(1)} KiB raw, ${(gzipBytes / 1024).toFixed(1)} KiB gzip`)
            }
          }
          console.log(`All Next.js client chunks: ${(rawTotal / 1024).toFixed(1)} KiB raw, ${(gzipTotal / 1024).toFixed(1)} KiB gzip across ${files.length} files`)
          NODE
      - run: npm run lint --prefix next-client
