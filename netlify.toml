[build]
  base = "client"
  command = "npm run build"
  publish = "dist"

# Vite emits fingerprinted files under /assets; cache them aggressively.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Keep the HTML shell fresh so new deployments are picked up immediately.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Keep API requests on the Netlify origin so browser session cookies remain first-party.
# Update the Render hostname here if Render assigns a different URL.
[[redirects]]
  from = "/api/*"
  to = "https://canvaslab-api.onrender.com/api/:splat"
  status = 200
  force = true

# React single-page application fallback.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
