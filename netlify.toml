[build]
  # Build the Next.js frontend rather than the legacy Vite client.
  base = "next-client"
  command = "npm run build"
  publish = ".next"

# Keep API requests on the Netlify origin so browser session cookies remain first-party.
# Update the Render hostname here if Render assigns a different URL.
[[redirects]]
  from = "/api/*"
  to = "https://canvaslab-api.onrender.com/api/:splat"
  status = 200
  force = true
